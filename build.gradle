plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            // ./gradlew runClient -PquickJoin=localhost:25565 joins a server straight away (handy for testing)
            if (project.hasProperty('quickJoin')) {
                programArguments.addAll('--quickPlayMultiplayer', project.property('quickJoin').toString())
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven {
        name = 'Curios API'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

dependencies {
    // Steel Rain is an addon for Superb Warfare, which is written in Kotlin and bundles Curios and its model library.
    implementation "maven.modrinth:superb-warfare:${sbw_version}"
    implementation "thedarkcolour:kotlinforforge-neoforge:${kff_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
